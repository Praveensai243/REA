# @sipp_smart — 45-day Shorts calendar (Nov 11 – Dec 25, 2026)
# Mon–Thu: health cautions, education, laws, history, facts.   Fri–Sun: cocktails & bottle picks.
# Each scene:  k = small coloured line, m = big text, s = small text under it,
#              stamp = MYTH / FACT / TIP (optional), list = true for recipe lists,
#              v = what the Telugu voice says.
# broll = search words for free Pexels background clips (or put your own clips in content/broll/<date>/).
# ask = the comment question on the last screen (m = on screen, v = voice).
# The first scene is the hook: keep it short, bold and curious.
# To change a video: edit its text here and commit. That day's video uses the new text.

